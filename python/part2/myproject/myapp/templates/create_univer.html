<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Create University</title>
</head>
<body>
    <h1 style="text-align: center;">Create University</h1>
    <form method="post" style="width: 300px; margin: auto; text-align: center; border: 1px solid #000; padding: 20px; box-shadow: 2px 2px 10px #aaa;">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="text-align: center; margin-top: 10px; border-top: 1px solid #000; padding-top: 10px;">
            <button type="submit">Create</button>
        </div>
    </form>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'home' %}">Back to Home</a>
    </div>
</body>
</html>
