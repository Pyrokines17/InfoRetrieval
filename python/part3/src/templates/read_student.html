<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Read Student</title>
</head>
<body>
    <h1 style="text-align: center;">Read Student</h1>

    <table border="1" style="width: 50%; margin: auto; text-align: center;">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Middle Name</th>
                <th>Birth Date</th>
                <th>University</th>
                <th>Study Start Date</th>
                <th>Modify</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student[1] }}</td>
                <td>{{ student[2] }}</td>
                <td>{{ student[3] }}</td>
                <td>{{ student[4] }}</td>
                <td>{{ student[5] }}</td>
                <td>{{ student[6] }}</td>
                <td><a href="{{ url_for('modify_student', student_id=student[0]) }}">Modify</a></td>
                <td><a href="{{ url_for('delete_student', student_id=student[0]) }}">Delete</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('index') }}">Back to Home</a>
    </div>
</body>
</html>
